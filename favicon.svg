<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>

    <!-- Lime Accent Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FF66"/>
      <stop offset="100%" stop-color="#C6FF33"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#C6FF33" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base for Universal Tab Contrast (Light & Dark Browser Themes) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#222A38" stroke-width="2"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#C6FF33" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Left Developer Code Bracket: < -->
  <path d="M15 22 L7.5 32 L15 42" fill="none" stroke="url(#limeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Dot in .NET -->
  <circle cx="21" cy="37.5" r="3" fill="#C6FF33" filter="url(#glow)"/>

  <!-- NET Developer Text in Bold Sans -->
  <text x="36.5" y="38.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" letter-spacing="-0.4px">NET</text>

  <!-- Right Developer Code Bracket: > -->
  <path d="M49 22 L56.5 32 L49 42" fill="none" stroke="url(#limeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
